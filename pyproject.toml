[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-driven-omr"
version = "0.1.0"
description = "Production-ready AI-driven document de-warping + OMR processing system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0.84",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "PyYAML>=6.0.2",
  "typer>=0.12.3",
]

[project.optional-dependencies]
yolo = [
  "ultralytics>=8.3.0",
]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
omr-system = "omr_system.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["omr_system*"]

